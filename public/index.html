<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live News Brief</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230a0e18%27/%3E%3Crect x=%277%27 y=%2713%27 width=%2718%27 height=%275%27 rx=%272.5%27 fill=%27%23e0ba64%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <span class="brand" id="brand"></span>
      <span class="live" id="live"><span class="dot"></span><span id="liveText"></span></span>
      <span class="spacer"></span>
      <button class="btn" id="savedBtn" aria-pressed="false"><span class="star">★</span> <span id="savedText"></span> <b id="savedCount">0</b></button>
      <button class="btn" id="bellBtn"></button>
      <button class="btn icon" id="layoutBtn" aria-label="Layout"></button>
      <button class="btn icon" id="themeBtn" aria-label="Theme"></button>
      <button class="btn icon" id="helpBtn" aria-label="Shortcuts">?</button>
      <button class="btn" id="refresh">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        <span id="refreshText"></span>
      </button>
      <div class="seg" id="langSeg"><button data-lang="ar">عربي</button><button data-lang="en">EN</button></div>
    </div>
    <div class="filters">
      <div class="row" id="regions"></div>
      <div class="row" id="topics"></div>
      <div class="row">
        <input type="search" id="q">
        <label class="switch"><input type="checkbox" id="uaeOnly"><span id="uaeLabel"></span></label>
        <label class="switch"><input type="checkbox" id="unreadOnly"><span id="unreadLabel"></span></label>
        <select id="hours"></select>
        <div class="seg" id="sortSeg"></div>
        <div class="pop">
          <button class="btn" id="srcBtn"></button>
          <div class="panel" id="srcPanel" hidden></div>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="insights">
    <div class="ins-block">
      <div class="ins-title" id="trendTitle"></div>
      <div class="row" id="trending"></div>
    </div>
    <div class="ins-block">
      <div class="ins-title" id="watchTitle"></div>
      <div class="row" id="watchlist"></div>
    </div>
    <div class="ins-block pulse-block">
      <div class="ins-title" id="pulseTitle"></div>
      <div id="pulse" class="pulse"></div>
      <div class="pulse-sub"><span id="pulseFrom"></span><span id="pulseTo"></span></div>
    </div>
  </section>

  <div id="banner"><button id="bannerBtn"></button></div>
  <div class="meta" id="meta"></div>
  <div class="grid" id="grid"></div>
  <div class="more"><button class="btn" id="moreBtn" hidden></button></div>
</main>

<div id="scrim"></div>
<aside id="drawer" aria-hidden="true" aria-label="Story">
  <div class="dhead">
    <button class="btn icon" id="dPrev" aria-label="Previous">‹</button>
    <button class="btn icon" id="dNext" aria-label="Next">›</button>
    <span class="spacer"></span>
    <button class="btn icon" id="dClose" aria-label="Close">✕</button>
  </div>
  <div id="dBody"></div>
</aside>

<div id="helpModal" class="modal" hidden><div class="modal-card" id="helpCard"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
